<title>文明沙盘</title>
<style>
:root{--bg:#f4efe4;--panel:#fffaf0;--ink:#2b2418;--muted:#7a6d58;--line:#d8ccb4;--acc:#9a3b1e;--good:#2f7a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16140f;--panel:#211e17;--ink:#ece3cf;--muted:#a89a80;--line:#3a3428;--acc:#e0855e;--good:#7fc48a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16140f;--panel:#211e17;--ink:#ece3cf;--muted:#a89a80;--line:#3a3428;--acc:#e0855e;--good:#7fc48a;color-scheme:dark}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Serif SC","Songti SC",serif;display:flex;flex-direction:column;height:100%;overflow:hidden}
header{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0 8px 0 0;color:var(--acc)}
.grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
input,select,button,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 7px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#fff}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
main{flex:1;display:flex;min-height:0}
aside{width:320px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:6px 0}
.tabs button.on{background:var(--bg);color:var(--acc);border-bottom:2px solid var(--acc)}
.pane{flex:1;overflow:auto;padding:6px 10px;display:none}.pane.on{display:block}
.nat{display:flex;gap:6px;align-items:center;padding:2px 4px;cursor:pointer;border-radius:3px}
.nat:hover,.nat.sel{background:var(--line)}
.sw{width:12px;height:12px;border-radius:2px;flex:none}
.ev{padding:3px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:13px}
.ev b{color:var(--acc);font-weight:normal;margin-right:4px}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:4px 0}
.card{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0;background:var(--bg)}

#mapwrap.paint{cursor:crosshair}
canvas{width:100%;height:100%;display:block}
#info{position:absolute;right:10px;top:10px;background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:6px;width:270px;max-height:calc(100% - 20px);overflow:auto;font-size:13px;display:none}
#info .x,#modal .x{float:right;cursor:pointer;color:var(--muted)}
#editbar{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);padding:6px 8px;border-radius:6px;display:none;font-size:13px}

.tree .r i{font-style:normal;background:var(--acc);color:#fff;border-radius:8px;padding:0 5px;margin-right:4px;font-size:11px}

#tl{flex:1;min-width:60px}
#year{min-width:96px;font-weight:bold}

#cmd{width:100%;min-height:70px;resize:vertical}

<script>
"use strict";
// ================= 基础 =================
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const W=240,H=120,N=W*H,STEP=5,PI=Math.PI;
const $=id=>document.getElementById(id);
const pick=(r,a)=>a[r()*a.length|0];
// 球面坐标
const P=new Float32Array(N*3),LAT=new Float32Array(N),LON=new Float32Array(N);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,la=(.5-(y+.5)/H)*PI,lo=(x+.5)/W*2*PI;LAT[i]=la;LON[i]=lo;P[i*3]=Math.cos(la)*Math.cos(lo);P[i*3+1]=Math.cos(la)*Math.sin(lo);P[i*3+2]=Math.sin(la)}
const NB=[];for(let i=0;i<N;i++){const x=i%W,y=i/W|0,r=[];
 for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const yy=y+dy;if(yy<0||yy>=H){r.push((y)*W+(x+W/2)%W);continue}r.push(yy*W+((x+dx+W)%W))}
 if(y>0&&y<H-1&&Math.abs(LAT[i])>1.2){r.push(y*W+(x+2)%W,y*W+(x-2+W)%W)} // 高纬地块横向更近
 NB[i]=r}
const nb=i=>NB[i];
const dot=(i,j)=>P[i*3]*P[j*3]+P[i*3+1]*P[j*3+1]+P[i*3+2]*P[j*3+2];
const cdist=(i,j)=>Math.acos(Math.max(-1,Math.min(1,dot(i,j))))*H/PI; // 以“格”为单位的大圆距离
// 3D 值噪声
function h3(i,j,k,s){let h=Math.imul(i,374761393)^Math.imul(j,668265263)^Math.imul(k,1440662683)^s;h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function noise3(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);let fx=x-xi,fy=y-yi,fz=z-zi;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);fz=fz*fz*(3-2*fz);
 const L=(a,b,t)=>a+(b-a)*t,c=(a,b,d)=>h3(xi+a,yi+b,zi+d,s);
 return L(L(L(c(0,0,0),c(1,0,0),fx),L(c(0,1,0),c(1,1,0),fx),fy),L(L(c(0,0,1),c(1,0,1),fx),L(c(0,1,1),c(1,1,1),fx),fy),fz)}
function fbm3(i,s,oct,f){let t=0,a=1,n=0;for(let o=0;o<oct;o++){t+=a*noise3(P[i*3]*f+7,P[i*3+1]*f+7,P[i*3+2]*f+7,s+o*101);n+=a;a*=.5;f*=2}return t/n}
// ================= 名字 =================
const SY={中原:"安平宁康乾坤华夏汉唐宋明晋魏燕赵齐楚秦韩吴越蜀梁陈隋周商".split(""),北境:"阿兰拔都哈喀图克鲁蒙兀赤察罕斡尔巴特勒铁木朵".split(""),
 西域:"萨珊波斯伊兰塔吉德拉米亚帕提阿卡迪苏玛".split(""),江南:"苏杭湖越吴会稽钱塘临安姑江陵扬润".split(""),帝国:"罗马维特斯卢奥古斯克劳底亚瓦伦提努塞尔".split("")};
const STYLES=Object.keys(SY);
const nameOf=(r,st,len)=>{let s="";for(let i=0;i<len;i++)s+=pick(r,SY[st]);return s};
const SURN="李王张刘陈杨赵黄周吴徐孙胡朱高林何郭马罗梁宋郑谢韩唐冯萧裴崔卢".split(""),GIV="德仁文武昭宣明成景康和平安泰元光英睿弘靖玄承嗣恭敬懿".split("");
const ZI2="之卿甫叔伯仲远达臣如度谋".split("");
const TITLE=["王国","帝国","汗国","公国","侯国","共和国","王朝","联邦"];
const OFFICE=["丞相","太尉","御史大夫","尚书令","中书令","太傅","司徒","大司马"];
const TERR=["","陆地","海洋","山脉","丘陵"];
// ================= 世界生成：板块 + 气候 =================
let world,sketch=new Uint8Array(N);
function genWorld(seed,nplates){
 const rnd=mulberry(hashStr(seed)),s0=hashStr(seed+"n")|0;
 const K=nplates,cen=[],vel=[],cont=[];
 for(let k=0;k<K;k++){const z=rnd()*2-1,t=rnd()*2*PI,r=Math.sqrt(1-z*z);const c=[r*Math.cos(t),r*Math.sin(t),z];cen.push(c);
  const ax=[rnd()-.5,rnd()-.5,rnd()-.5],v=[c[1]*ax[2]-c[2]*ax[1],c[2]*ax[0]-c[0]*ax[2],c[0]*ax[1]-c[1]*ax[0]],m=Math.hypot(...v)||1,sp=.3+rnd()*1.2;
  vel.push(v.map(q=>q/m*sp));cont.push(rnd()<.42)}
 const plate=new Uint8Array(N),base=new Float32Array(N),ele=new Float32Array(N);
 for(let i=0;i<N;i++){const wx=P[i*3]+(fbm3(i,s0+1,3,2)-.5)*.6,wy=P[i*3+1]+(fbm3(i,s0+2,3,2)-.5)*.6,wz=P[i*3+2]+(fbm3(i,s0+3,3,2)-.5)*.6;
  let b=0,bd=-9;for(let k=0;k<K;k++){const d=wx*cen[k][0]+wy*cen[k][1]+wz*cen[k][2];if(d>bd){bd=d;b=k}}plate[i]=b;base[i]=cont[b]?.35:-.45}
 // 板块边界：汇聚造山、俯冲成海沟、离散成洋中脊/裂谷
 let bnd=new Float32Array(N);
 for(let i=0;i<N;i++)for(const j of nb(i)){const a=plate[i],b=plate[j];if(a===b)continue;
  const d=[P[j*3]-P[i*3],P[j*3+1]-P[i*3+1],P[j*3+2]-P[i*3+2]],m=Math.hypot(...d)||1;
  const conv=((vel[a][0]-vel[b][0])*d[0]+(vel[a][1]-vel[b][1])*d[1]+(vel[a][2]-vel[b][2])*d[2])/m;
  let e;if(conv>0)e=cont[a]&&cont[b]?conv*1.3:cont[a]?conv*.9:cont[b]?-conv*.5:conv*.45;else e=cont[a]?conv*.35:-conv*.25;
  bnd[i]+=e/2}
 for(let it=0;it<5;it++){const nb2=new Float32Array(N);for(let i=0;i<N;i++){let s=0;for(const j of nb(i))s+=bnd[j];nb2[i]=bnd[i]*.55+s/nb(i).length*.45}bnd=nb2}
 for(let it=0;it<4;it++){const b2=base.slice();for(let i=0;i<N;i++){let s=0;for(const j of nb(i))s+=base[j];b2[i]=base[i]*.4+s/nb(i).length*.6}base.set(b2)}
 for(let i=0;i<N;i++){const ridge=1-Math.abs(fbm3(i,s0+9,4,4)*2-1);
  ele[i]=base[i]+bnd[i]*1.6*(.6+ridge*.6)+(fbm3(i,s0+5,6,2.2)-.5)*.75-Math.max(0,Math.abs(LAT[i])-1.25)*.4}
 const so=Float32Array.from(ele).sort(),sea=so[N*.62|0],lo=so[0],hi=so[N-1];
 for(let i=0;i<N;i++)ele[i]=ele[i]<sea?(ele[i]-sea)/(sea-lo):(ele[i]-sea)/(hi-sea);
 // 草图覆盖
 for(let i=0;i<N;i++){const s=sketch[i];if(!s)continue;const n=fbm3(i,s0+7,3,6);
  if(s===1)ele[i]=Math.max(ele[i],.04+n*.18);else if(s===2)ele[i]=Math.min(ele[i],-.25-n*.3);else if(s===3)ele[i]=Math.max(ele[i],.6+n*.35);else if(s===4)ele[i]=Math.max(ele[i],.3+n*.2)}
 // 气温、降水（三圈环流风带输送水汽，迎风坡多雨、背风雨影）
 const tmp=new Float32Array(N),rain=new Float32Array(N),bio=new Uint8Array(N),hab=new Float32Array(N);
 for(let y=0;y<H;y++){const lat=Math.abs((.5-(y+.5)/H)*2),dir=(lat<.33||lat>.66)?-1:1,bs=lat<.12?1.2:lat<.33?.6:lat<.66?1:.55;let mo=1;
  for(let k=0;k<W*2;k++){const x=((dir>0?k:-k)%W+W)%W,i=y*W+x;
   if(ele[i]<0)mo=Math.min(1,mo+.08);else mo=Math.max(0,mo-.006-Math.max(0,ele[i])*.06);
   if(k>=W)rain[i]=Math.min(1,mo*bs*(.7+.6*fbm3(i,s0+11,3,5)))}
  for(let x=0;x<W;x++){const i=y*W+x;tmp[i]=1-lat*1.15-Math.max(0,ele[i])*.55}}
 for(let i=0;i<N;i++){const e=ele[i],t=tmp[i],r=rain[i];let b;
  if(e<0)b=e<-.35?0:1;else if(t<.05)b=2;else if(e>.65)b=3;else if(t<.25)b=r>.3?4:5;else if(r<.15)b=6;else if(r<.35)b=7;else if(t>.7&&r>.6)b=9;else b=8;
  if(e<0&&t<-.05)b=2;bio[i]=b;hab[i]=[0,0,0,.05,.25,.15,.05,.7,1,.55][b]}
 const flow=new Float32Array(N),ord=[...Array(N).keys()].filter(i=>ele[i]>0).sort((a,b)=>ele[b]-ele[a]);
 for(const i of ord){flow[i]+=rain[i];let best=-1,be=ele[i];for(const j of nb(i))if(ele[j]<be){be=ele[j];best=j}if(best>=0)flow[best]+=flow[i]}
 const river=new Uint8Array(N);for(let i=0;i<N;i++)if(ele[i]>0&&flow[i]>16&&bio[i]!==2){river[i]=1;hab[i]=Math.min(1.3,hab[i]+.4)}
 for(let i=0;i<N;i++)if(ele[i]>0&&nb(i).some(j=>ele[j]<0))hab[i]+=.15;
 return{ele,tmp,rain,bio,hab,river,plate,seed}}
// ================= 历史推演 =================
let S,mods=[],playing=false;
function Sim(seed,ncivs,mods){
 const rnd=mulberry(hashStr(seed+"#civ")),w=world;
 const own=new Int16Array(N).fill(-1),eth=new Int8Array(N).fill(-1),rel=new Int8Array(N).fill(-1);
 const S={t:0,lastKeep:0,dts:[],playPid:null,playDead:false,own,eth,rel,nations:[],ethnics:[],religions:[],events:[],snaps:[],people:[],wars:new Map(),allies:new Set(),contact:new Map(),mods};
 const {nations,people,wars,allies}=S;
 mods.forEach(m=>delete m.res);
 const key=(a,b)=>a<b?a+"-"+b:b+"-"+a;
 const log=(y,type,text,nat,cell,pp)=>S.events.push({y,t:S.t,type,text,nat,cell,pp});
 const land=[];for(let i=0;i<N;i++)if(w.hab[i]>.5)land.push(i);
 // ---- 人物 ----
 const person=o=>{o.id=people.length;o.bio=[];o.zi="字"+pick(rnd,GIV)+pick(rnd,ZI2);people.push(o);return o};
 const gname=sur=>sur+pick(rnd,GIV)+(rnd()<.6?pick(rnd,GIV):"");
 const bio=(id,y,t)=>{if(id!=null&&id>=0)people[id].bio.push([y,t])};
 const pn=id=>id!=null&&id>=0?people[id].name:"";
 function crown(n,y,o={}){const ord=n.rulers.filter(id=>people[id].dyn===n.dynasty).length+1;
  const p=person({name:o.name||gname(n.surname),role:"君主",nat:n.id,born:y-(o.age??(8+rnd()*30|0)),from:y,to:null,father:o.father??null,dyn:n.dynasty,ord,origin:n.cityName,player:!!o.player});
  bio(p.id,y,`${o.how||"继位"}，为${n.name}第${n.dynasty}朝第${ord}位君主。`);n.rulers.push(p.id);n.ruler=p.id;
  if(y-p.born<15&&n.mins.length){const m=n.mins[0];bio(m,y,`幼主${p.name}即位，受遗诏辅政。`);log(y,"辅政",`${n.name}幼主${p.name}即位，${OFFICENAME(m)}${pn(m)}辅政。`,n.id,n.cap,[p.id,m])}
  return p}
 const OFFICENAME=id=>people[id].title||"";
 function appointMin(n,y){const p=person({name:gname(pick(rnd,SURN)),role:"名臣",title:pick(rnd,OFFICE),nat:n.id,born:y-(25+rnd()*20|0),from:y,to:null,dyn:n.dynasty,origin:nameOf(rnd,n.style,2)});

 const T=[...$("o-t").options].reduce((a,o)=>(a[o.value]=o.textContent,a),{});
 $("o-list").innerHTML=mods.map((m,i)=>m.o?`<div class="card"><b>${m.t/360}年</b> ${S.nations[m.nat]?.name||"?"} ${T[m.type].replace("…",m.target!=null?S.nations[m.target]?.name:"邻国")}
  <span style="color:${m.res==="已执行"?"var(--good)":"var(--acc)"}">${m.res?"· "+m.res:"· 待推演"}</span> <button onclick="mods.splice(${i},1);renderOutline()">删</button></div>`:"").join("")||'<div class="muted">尚无大纲条目</div>'}
$("o-add").onclick=()=>{const y=Math.round(+$("o-y").value),g=$("o-g").value;mods.push({type:$("o-t").value,nat:+$("o-n").value,t:y*360,target:g===""?null:+g,o:1});renderOutline()};
$("o-run").onclick=()=>{if(playing)return toast("降临中不能照大纲重演，请先离开此身");cur=0;run()};
// ---- 降临 ----
function replay(dts,until){S=Sim($("cseed").value,+$("ncivs").value,mods);let i=0;while(S.t<until){S.step(dts[i]??1800);i++}}
let lastDeath=null;
function cooldown(y){return lastDeath!=null&&y<lastDeath+30?lastDeath+30-y:0}
function descendPerson(pid){const p=S.people[pid],cd=cooldown(yearNow());if(cd)return toast(`你上一世卒于${lastDeath}年，须等到${lastDeath+30}年才能再次降临（还差${cd}年）`);
 modal(`<h3 style="margin-top:0">降临 · ${p.name}</h3><div>${S.nations[p.nat]?.name||""} ${p.title||p.role} · ${yearNow()} 年，${yearNow()-p.born} 岁</div>
 <div class="row">以何名降临：<input id="dname" value="${p.name}" size="8"></div>
 <div class="hint">降临后，${yearNow()} 年以后的历史作废，从此由你的决策推动。君主可以直接下诏；臣子、将领、先知的建议要看君主纳不纳，也可以谋反、自立或投奔他国。</div>
 <div class="row"><button class="pri" id="dgo">降临</button><button onclick="closeModal()">取消</button></div>`);
 $("dgo").onclick=()=>{const nm=$("dname").value.trim(),T0=tNow(),dts=S.dts.slice();closeModal();
  stopRun();mods=mods.filter(m=>m.t<=T0);replay(dts,T0);const q=S.people[pid];if(!q||q.to!==null)return toast("此人此时已不在世");
  mods.push({type:"avatar",pid,name:nm&&nm!==q.name?nm:null,t:S.t,nat:q.nat});playing=true;S.step(1);afterStep();
  document.querySelector('.tabs [data-t=play]').click();toast(`你已降临为${S.people[pid].name}`);startRun()}}
let pendingCap=false,curEdict=null;
function afterStep(follow=true){const wasEnd=+$("tl").value>=+$("tl").max-1;$("tl").max=S.snaps.length-1;for(const k in colorCache)delete colorCache[k];
 if(playing&&S.playPid!=null){const me=S.people[S.playPid];if((S.playDead||me.to!==null)&&lastDeath==null&&!me.cooled){lastDeath=me.died??me.to;me.cooled=1;toast(`${me.name}已逝。30 年后（${lastDeath+30}年）方可再次降临`)}}
 if(follow||wasEnd)setCur(S.snaps.length-1);else{$("year").textContent;updateSide()}
 if(S.nations.length!==+$("filter").dataset.n){refreshFilter();$("filter").dataset.n=S.nations.length}autosave()}
const EDICTS=[
 ["大河决堤，沿岸州县告急。",[["发帑赈灾","发帑赈灾，修堤安民"],["置之不理","坐视不理，加税修宫"]]],
 ["边将请增兵戍边。",[["准奏扩军","扩军练兵"],["罢兵屯田","休养生息，劝农桑"]]],
 ["朝中党争日烈。",[["整肃朝纲","整肃朝纲，肃贪"],["听之任之","享乐，不问政事"]]],
 ["西方商旅请开互市。",[["开市通商","开互市通商"],["闭关自守","守成，闭关"]]]];
const RULES=[
 [/宣战|攻打|讨伐|进攻|出兵|征讨|北伐|南征|西征|东征|伐/,"war",1],[/议和|停战|求和|罢兵|讲和/,"peace",1],[/结盟|联合|和亲|盟约|结好|联姻/,"ally",1],
 [/投奔|投靠|归顺|叛逃|出奔/,"defect",1],[/刺杀|行刺|暗杀/,"kill",1],[/篡位|谋反|夺位|逼宫|政变|弑君/,"usurp"],[/自立|割据|独立|称王|称帝/,"rebel"],
 [/迁都/,"capital"],[/扩张|开疆|拓土|开拓/,"policy:扩张"],[/守成|休养生息|固守|防御|保境|闭关/,"policy:守成"],[/均衡|中庸/,"policy:均衡"],
 [/享乐|修宫|求仙|丹药|选秀|加税|苛政|不问政事|荒淫/,"bad"],
 [/赈灾|水利|修堤|减税|轻徭|劝农|农桑|通商|互市|兴学|修路|发展|屯田|安民|科举/,"dev"],[/扩军|练兵|征兵|整军|募兵|兵器|骑兵|水师/,"mil"],
 [/整肃|肃贪|变法|改革|安抚|大赦|削藩|朝纲|立法/,"stab"]];
function parseCmd(text){const me=S.people[S.playPid],my=S.nations[me.nat],alive=S.nations.filter(n=>n.alive&&n.id!==my.id),acts=[],unknown=[];
 const nbs=[...(S.contact.get(my.id)||[])].map(i=>S.nations[i]).filter(n=>n.alive);
 const findNat=c=>{for(const n of alive)if(c.includes(n.name))return n;
  for(const n of alive){const core=n.name.replace(/(王国|帝国|汗国|公国|侯国|共和国|王朝|联邦)$/,"");if(core.length>=2&&c.includes(core))return n;if(core.length===1&&new RegExp(core+"[国军人朝]").test(c))return n}
  if(/最强|大国/.test(c))return[...nbs].sort((a,b)=>b.cells-a.cells)[0];if(/最弱|小国/.test(c))return[...nbs].sort((a,b)=>a.cells-b.cells)[0];
  return null};
 for(const c of text.split(/[，。；;,.!！？?\n、]+/).map(x=>x.trim()).filter(Boolean)){const r=RULES.find(r=>r[0].test(c));if(!r){unknown.push(c);continue}
  const [a,p]=r[1].split(":"),o={a};if(p)o.p=p;
  if(r[2]){let t=findNat(c);if(!t&&a==="war"){const enemies=nbs.filter(n=>!S.allies.has(S.key(my.id,n.id)));t=enemies.sort((x,y)=>x.cells-y.cells)[0]}
   if(!t&&a==="peace"){const w=[...S.wars.values()].find(v=>v.a===my.id||v.b===my.id);if(w)t=S.nations[w.a===my.id?w.b:w.a]}
   if(!t&&a==="defect")t=[...nbs].sort((x,y)=>y.cells-x.cells)[0];o.target=t?t.id:null}
  acts.push(o)}
 return{acts,unknown}}
function renderPlay(){const el=$("p-play"),draft=$("cmd")?.value||"",dtv=$("dt")?.value,foc=document.activeElement&&document.activeElement.id==="cmd",pres=$("pres")?.textContent||"";
 if(!playing||S.playPid==null){const cd=cooldown(S.snaps[S.snaps.length-1].y);el.innerHTML=`${cd?`<div class="card">⏳ 你上一世卒于 ${lastDeath} 年，还要等 ${cd} 年（到 ${lastDeath+30} 年）才能再次降临。</div>`:""}<div class="card"><b>降临</b><br>拖动时间轴到任意一年，然后：<br>· 在国家详情里点「⚡ 降临为此国君主」；<br>· 或在「人物」里点开任何一个人（名臣、将领、先知……），点「⚡ 降临此人」。<br><br>降临后用文字写下你的决策，选一日、一月、一年或五年，世界会照你的决策往下演化。</div>`;return}
 const me=S.people[S.playPid],n=S.nations[me.nat],t=S.t,ruler=n.ruler===me.id;
 if(S.playDead||me.to!==null){el.innerHTML=`<div class="card"><b>${me.name}的一生结束了（${me.died??me.to}年）。</b><br>${me.bio.slice(-3).map(b=>b[0]+"年 "+b[1]).join("<br>")}</div><div class="hint">按天道，${lastDeath!=null?lastDeath+30:"三十年后"}年之后才能再次降临。历史会继续往下走。</div><div class="row"><button data-p="${me.id}">看生平</button><button class="pri" onclick="exitPlay()">继续观看历史</button></div>`;return}
 const nbs=[...(S.contact.get(n.id)||[])].filter(i=>S.nations[i].alive);
 if(ruler&&!curEdict&&Math.random()<.3)curEdict=EDICTS[Math.random()*EDICTS.length|0];
 el.innerHTML=`<div class="card"><b>★ ${plink(me.id)}</b> <span class="muted">${me.zi}</span><br><span style="color:${n.color}">${n.name}</span> ${ruler?"君主":me.title||me.role} · ${t/360-me.born|0} 岁<br>
 <b>${fmt(t)}</b> · 都城 ${n.cityName} · 疆域 ${n.cells} 州<br><span class="muted">国策 ${n.policy} · 军势 ${n.aggr*100|0} · 民生 ${(1+n.dev)*100|0}${n.stab>0?" · 朝局安定":""}${ruler?"":" · 当今君主 "+S.people[n.ruler].name}</span></div>
 ${curEdict?`<div class="card">📜 奏折：${curEdict[0]}<div class="row">${curEdict[1].map((c,i)=>`<button onclick="$('cmd').value='${c[1]}'">${c[0]}</button>`).join("")}</div></div>`:""}
 <textarea id="cmd" placeholder="写下你的决策，可写多句。例：${ruler?"对"+(nbs[0]!=null?S.nations[nbs[0]].name:"邻国")+"宣战，扩军练兵，兴修水利。":"进言劝农桑；或：起兵谋反 / 据城自立 / 投奔"+(nbs[0]!=null?S.nations[nbs[0]].name:"邻国")}"></textarea>
 <div class="row">然后过 <select id="dt"><option value="1">一日</option><option value="30">一月</option><option value="360" selected>一年</option><option value="1800">五年</option></select><button class="pri" id="go">执行</button></div>
 <div class="hint">认得的说法：宣战/讨伐/议和/结盟/和亲 + 国名；迁都；扩张、守成；赈灾、水利、减税、通商、兴学；扩军、练兵；整肃朝纲、变法；刺杀 + 国名；${ruler?"":"谋反、篡位、自立、投奔 + 国名；"}享乐、求仙（会出乱子）。不认得的句子只记入史册。${ruler?"":"你不是君主，国事要君主纳谏才算数。"}</div>
 <div id="pres" class="hint"></div>
 <h4 style="margin:6px 0">邻国</h4>${nbs.map(i=>{const tn=S.nations[i],k=S.key(n.id,i),war=S.wars.has(k),al=S.allies.has(k);
  return`<div class="nat"><span class="sw" style="background:${tn.color}"></span>${tn.name}<small class="muted">${tn.cells}州${war?" ⚔交战":al?" 🤝盟友":""}</small></div>`}).join("")||'<div class="muted">尚无接壤之国</div>'}
 <div class="row" style="margin-top:6px"><button onclick="exitPlay()">离开此身，让历史继续</button></div>
 <h4 style="margin:6px 0">近事</h4>${S.events.filter(e=>e.t>=t-1800&&(e.nat===n.id||e.text.includes(n.name)||e.pp&&e.pp.includes(me.id))).reverse().slice(0,14).map(e=>`<div class="ev"><b>${fmtE(e)}</b> ${e.text}</div>`).join("")}`;
 $("go").onclick=()=>{const txt=$("cmd").value.trim(),dt=+$("dt").value;let msg="";
  $("cmd").value="";if(txt){const {acts,unknown}=parseCmd(txt);const m={type:"cmd",text:txt,acts,t:S.t,nat:n.id};mods.push(m);curEdict=null;
   S.step(dt);msg=(m.res||"")+(unknown.length?`；史官记下：「${unknown.join("，")}」`:"")}else S.step(dt);
  afterStep();if(msg){$("pres").textContent="结果："+msg;toast(msg.slice(0,40))}}
 $("cmd").value=draft;if(dtv)$("dt").value=dtv;if(pres)$("pres").textContent=pres;if(foc){$("cmd").focus();$("cmd").setSelectionRange(draft.length,draft.length)}}
function exitPlay(){playing=false;startRun();updateSide()}
// ---- 推演 ----
function refreshFilter(){$("filter").innerHTML='<option value="">全部</option>'+S.nations.map(n=>`<option value="${n.id}">${n.name}</option>`).join("")}
function run(){playing=false;stopRun();S=Sim($("cseed").value,+$("ncivs").value,mods);S.step(360);
 for(const k in colorCache)delete colorCache[k];$("tl").max=0;refreshFilter();setCur(0);startRun()}
let timer=null,running=false;
function stopRun(){running=false;clearInterval(timer);timer=null;$("play").textContent="▶ 继续";}
function startRun(){stopRun();running=true;$("play").textContent="⏸ 暂停";timer=setInterval(()=>{if(!S)return;
 const t0=performance.now();S.step(360);afterStep(false);$("prog").textContent=`${S.nations.filter(n=>n.alive).length} 国并立 · 已演化 ${S.snaps[S.snaps.length-1].y} 年 · ${S.people.length} 人 · ${S.events.length} 事`},+$("speed").value)}
function newWorld(){world=genWorld($("seed").value,+$("nplates").value);draw()}
$("gen").onclick=()=>{mods=[];playing=false;lastDeath=null;selected=null;cur=0;$("info").style.display="none";newWorld();run()};
// ---- 地图操作 ----
let drag=null;
$("mapwrap").addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*view.dpr,py=(e.clientY-r.top)*view.dpr;
 drag={x:e.clientX,y:e.clientY,moved:false,paint:editMode&&!e.shiftKey};if(drag.paint)paint(px,py);$("mapwrap").setPointerCapture(e.pointerId)});
$("mapwrap").addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
 if(drag.paint){const r=cv.getBoundingClientRect();paint((e.clientX-r.left)*view.dpr,(e.clientY-r.top)*view.dpr);return}
 if(view.globe){rotLon-=dx/(view.R/view.dpr);rotLat=Math.max(-1.4,Math.min(1.4,rotLat+dy/(view.R/view.dpr)))}else panX+=dx/(view.sc/view.dpr);
 drag.x=e.clientX;drag.y=e.clientY;draw(false)});
$("mapwrap").addEventListener("pointerup",e=>{const d=drag;drag=null;if(!d||d.paint){if(d&&d.paint)draw();return}if(d.moved)return;
 const r=cv.getBoundingClientRect(),c=unproject((e.clientX-r.left)*view.dpr,(e.clientY-r.top)*view.dpr);if(c<0||!S)return;
 const o=S.snaps[cur].own[c];selected=o>=0?o:null;
 if(selected===null){const b=["深海","浅海","冰原","高山","针叶林","苔原","荒漠","草原","温带林","雨林"][world.bio[c]];const box=$("info");box.style.display="block";box.dataset.nat="";
  box.innerHTML=`<span class="x" onclick="this.parentNode.style.display='none'">✕</span>无主之地 · ${b}<br>海拔 ${(world.ele[c]*5000|0)} 米 · 板块 #${world.plate[c]}${world.river[c]?" · 河流":""}<br>纬度 ${(LAT[c]*180/PI).toFixed(0)}°
  ${world.ele[c]>0&&!playing?`<div class="row"><button onclick="mods.push({type:'found',cell:${c},t:tNow()});rewind(tNow());S.step(360);afterStep()">在此立国（从此年重演）</button></div>`:""}`}
 else showNation(selected);draw();updateSide()});
$("mapwrap").addEventListener("wheel",e=>{e.preventDefault()},{passive:false});
function paint(px,py){const c=unproject(px,py);if(c<0)return;const r=+$("bsize").value,b=+$("brush").value;
 for(let i=0;i<N;i++)if(cdist(i,c)<=r)sketch[i]=b;draw()}
$("edit").onclick=()=>{editMode=!editMode;$("edit").classList.toggle("on",editMode);$("editbar").style.display=editMode?"block":"none";$("mapwrap").classList.toggle("paint",editMode);if(editMode)$("layer").value="bio";draw()};
$("sk-apply").onclick=()=>{newWorld();mods=mods.filter(m=>m.type!=="found");run()};
$("sk-clear").onclick=()=>{sketch.fill(0);draw()};
$("tl").oninput=e=>setCur(+e.target.value);
$("layer").onchange=()=>draw();$("labels").onchange=()=>draw(false);$("proj").onchange=()=>draw(false);addEventListener("resize",()=>draw(false));
$("play").onclick=()=>running?stopRun():startRun();
$("speed").onchange=()=>{if(running)startRun()};
// ================= 存档 / 导出 =================
function rle(a){let o=[],p=a[0],c=0;for(const v of a){if(v===p&&c<99999)c++;else{o.push(p+"x"+c);p=v;c=1}}o.push(p+"x"+c);return o.join(",")}
function unrle(s,Arr){const out=[];for(const t of s.split(",")){const[v,c]=t.split("x").map(Number);for(let i=0;i<c;i++)out.push(v)}return Arr?Arr.from(out):out}
function state(){return{v:4,lastDeath,seed:$("seed").value,cseed:$("cseed").value,ncivs:+$("ncivs").value,nplates:+$("nplates").value,mods,
 sketch:sketch.some(v=>v)?rle(sketch):"",dts:rle(S.dts),playing,t:tNow(),sel:selected}}
function restore(st){$("seed").value=st.seed;$("cseed").value=st.cseed||"1";lastDeath=st.lastDeath??null;stopRun();$("ncivs").value=st.ncivs;$("nplates").value=st.nplates||14;
 mods=(st.mods||[]).map(m=>(m.t==null&&(m.t=m.y*360),m));sketch=st.sketch?unrle(st.sketch,Uint8Array):new Uint8Array(N);playing=!!st.playing;newWorld();
 $("prog").textContent="推演中…";setTimeout(()=>{const dts=st.dts?unrle(st.dts):[];S=Sim($("cseed").value,+$("ncivs").value,mods);
  for(const d of dts)S.step(d);if(!dts.length)S.step(360);
  $("tl").max=S.snaps.length-1;refreshFilter();$("prog").textContent=`${S.nations.length} 国 · ${S.people.length} 人 · ${S.events.length} 事`;
  selected=st.sel??null;const k=S.snaps.findIndex(s=>s.t>=(st.t??0));setCur(k<0?S.snaps.length-1:k);if(selected!==null&&S.nations[selected])showNation(selected);
  if(playing)document.querySelector('.tabs [data-t=play]').click();startRun()},20)}
function autosave(){try{localStorage.setItem("civ-sandbox",JSON.stringify(state()))}catch(e){}}
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s))),b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0)));
function copyBox(title,text,note){modal(`<h3 style="margin-top:0">${title}</h3><div class="hint">${note||""}</div><textarea id="cbox" style="width:min(640px,80vw);height:240px" readonly></textarea><div class="row"><button class="pri" id="cbtn">复制</button></div>`);
 $("cbox").value=text;$("cbtn").onclick=()=>{$("cbox").select();(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast("已复制"),()=>toast("请按 Ctrl+C 复制已选中的文字"))}}
$("save").onclick=()=>{let code="";try{code=b64e(JSON.stringify(state()))}catch(e){}copyBox("存档码",code,"复制这段存档码保存起来或发给别人；在「读档」里粘贴即可还原到同一年、同一个世界（含你的草图、干预、大纲与降临决策）。世界也会自动保存在本浏览器。")};
$("load").onclick=()=>{modal(`<h3 style="margin-top:0">读档</h3><div class="hint">粘贴存档码，或选择一个存档 .json 文件。</div><textarea id="lbox" style="width:min(640px,80vw);height:160px"></textarea>
 <div class="row"><input type="file" id="file" accept=".json,.txt"><button class="pri" id="lbtn">读取</button></div>`);
 $("file").onchange=async e=>{const f=e.target.files[0];if(f)$("lbox").value=await f.text()};
 $("lbtn").onclick=()=>{const v=$("lbox").value.trim();try{restore(JSON.parse(v.startsWith("{")?v:b64d(v)));closeModal()}catch(err){toast("存档码无法识别，请检查是否复制完整")}}};
$("png").onclick=()=>{const url=cv.toDataURL("image/png");modal(`<h3 style="margin-top:0">地图图片 · ${yearNow()}年</h3><div class="hint">右键（手机上长按）图片即可保存。</div><img src="${url}" style="max-width:min(860px,88vw);border:1px solid var(--line)">`)};
$("md").onclick=()=>{const t0=tNow();let t=`# 编年史（地图种子 ${$("seed").value}，至 ${fmt(t0)}）\n`;let last=-1;
 for(const e of S.events){if(e.t>t0)break;if(e.y!==last){t+=`\n## ${e.y} 年\n\n`;last=e.y}t+=`- 【${e.type}】${e.text}\n`}
 copyBox("编年史（Markdown）",t,"复制后可粘贴到任何笔记或文档里。")};
// ================= 启动 =================
(function boot(){let st=null;try{st=JSON.parse(localStorage.getItem("civ-sandbox")||"null")}catch(e){}
 try{if(st&&st.seed&&st.v===4){restore(st);return}}catch(e){}$("gen").click()})();
