<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>裂境峡谷 · 地图总览</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b171d;color:#dce9df;font-family:system-ui,"Microsoft YaHei",sans-serif}header{min-height:74px;padding:16px 24px;display:flex;align-items:center;gap:22px;border-bottom:1px solid #37504b}a{color:#9bd9ce;text-decoration:none}h1{font-size:19px;margin:0}header span{color:#8ea79d;font-size:13px}label{margin-left:auto;font-size:13px}main{display:grid;place-items:center;padding:12px}canvas{width:min(calc(100vw - 24px),calc(100vh - 112px));height:auto;box-shadow:0 12px 60px #0008;border:1px solid #3b5c50}footer{text-align:center;color:#8ea79d;font-size:12px;padding:0 12px 10px}@media(max-width:700px){header{gap:10px;flex-wrap:wrap;padding:10px}header span{display:none}}
</style></head><body><header><a href="index.html">← 返回游戏</a><h1>裂境峡谷</h1><span>三路 · 河道 · 四片野区 · 22种野怪 · 多边形墙体 / 15000 × 15000</span><label><input id="ranges" type="checkbox"> 显示防御塔射程</label></header><div style="padding:12px;display:flex;gap:12px;flex-wrap:wrap"><select id="mapMode"><option>NORMAL_MAP</option><option>JUNGLE_MAP</option><option>WALL_COLLISION_MAP</option><option>BRUSH_MAP</option><option>WALL_BRUSH_MAP</option><option>NAVIGATION_MAP</option><option>VISION_MAP</option><option>PROJECTILE_COLLISION_MAP</option></select><button id="exportMap">导出4096 PNG</button><select id="element"><option>BASE</option><option>INFERNAL</option><option>MOUNTAIN</option><option>OCEAN</option></select><span id="debugInfo">点击地图查看坐标、草丛；寻路模式依次设置起终点</span><a href="monsters.html">查看22种野怪模型</a></div><main><canvas id="atlas" width="1536" height="1536" aria-label="裂境峡谷全地图，包含三路、四片野区、墙体、草丛及22座防御塔"></canvas></main><footer>蓝方与红方对角基地　·　红蓝 buff 营地　·　防御塔射程 465　·　自然金币 3 / 秒</footer><script src="config/current.js"></script><script src="config-v9.js"></script><script src="new-heroes.js"></script><script src="genji.js"></script><script src="items-v6.js"></script><script src="world.js"></script><script src="tower-layout.js"></script><script src="world-v14.js"></script><script src="terrain.js"></script><script src="map-debug-v14.js"></script><script>
const C=GAME_CONFIG,canvas=document.getElementById('atlas');let from=null,path=[];function draw(){drawMapDebugV14(canvas,document.getElementById('mapMode').value,{path})}document.getElementById('mapMode').onchange=()=>{from=null;path=[];draw()};document.getElementById('element').onchange=e=>{ElementalTerrainManager.apply(e.target.value);draw()};document.getElementById('ranges').onchange=draw;canvas.onclick=e=>{let r=canvas.getBoundingClientRect(),p={x:(e.clientX-r.left)/r.width*C.world,y:(e.clientY-r.top)/r.height*C.world},b=C.map.bushes.find(b=>C.map.brushContains(b,p.x,p.y));document.getElementById('debugInfo').textContent=Math.round(p.x)+', '+Math.round(p.y)+(b?' · '+b.brushId:'');if(document.getElementById('mapMode').value==='NAVIGATION_MAP'){if(from){path=findMapDebugPath(from,p);from=null;document.getElementById('debugInfo').textContent+=' · 路径 '+path.length+' 节点'}else from=p;draw()}};document.getElementById('exportMap').onclick=()=>{let out=document.createElement('canvas');out.width=out.height=4096;drawMapDebugV14(out,document.getElementById('mapMode').value,{path});let a=document.createElement('a');a.download=document.getElementById('mapMode').value+'.png';a.href=out.toDataURL('image/png');a.click()};draw();</script></body></html>
